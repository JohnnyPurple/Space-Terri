const SPR = {};
function makeFace(k, im) {
  const S = 120;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.beginPath(); g.arc(S / 2, S / 2, S / 2, 0, TAU); g.clip(); g.drawImage(im, 0, 0, S, S);
  SPR[k] = c;
  const s = document.createElement('canvas'); s.width = s.height = S;
  const h = s.getContext('2d');
  h.drawImage(c, 0, 0); h.globalCompositeOperation = 'source-atop';
  h.fillStyle = 'rgba(90,255,90,0.38)'; h.fillRect(0, 0, S, S);
  SPR[k + '_sick'] = s;
}
for (const k in FACE_SRC) { const im = new Image(); im.onload = () => makeFace(k, im); im.src = FACE_SRC[k]; }

const VIR = [['#7CFF5B', '#1f8a2b'], ['#ff5bd6', '#8a1f6e'], ['#ffb02e', '#8a4a10']].map(([col, sh]) => {
  const c = document.createElement('canvas'); c.width = c.height = 48;
  const g = c.getContext('2d'); g.translate(24, 24);
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * TAU;
    g.strokeStyle = col; g.lineWidth = 3;
    g.beginPath(); g.moveTo(Math.cos(a) * 11, Math.sin(a) * 11); g.lineTo(Math.cos(a) * 18, Math.sin(a) * 18); g.stroke();
    g.fillStyle = col; g.beginPath(); g.arc(Math.cos(a) * 19.5, Math.sin(a) * 19.5, 3.6, 0, TAU); g.fill();
  }
  const rg = g.createRadialGradient(-4, -4, 1, 0, 0, 14);
  rg.addColorStop(0, '#ffffff'); rg.addColorStop(0.3, col); rg.addColorStop(1, sh);
  g.fillStyle = rg; g.beginPath(); g.arc(0, 0, 13, 0, TAU); g.fill();
  g.fillStyle = 'rgba(0,0,0,0.25)';
  for (const [x, y] of [[4, 3], [-3, 6], [5, -5]]) { g.beginPath(); g.arc(x, y, 1.8, 0, TAU); g.fill(); }
  return c;
});

function catmull(pts, seg = 12) {

}

let actx = null, master = null, muted = false, noiseBuf = null;
function audio() {

      master = actx.createGain(); master.gain.value = 0.7; master.connect(actx.destination);

}
function tone(freq, dur, type = 'square', vol = 0.06, slide = 0, delay = 0) {

  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}

    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t);
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
}

function followPath(e, dt) {
  let dist = e.speed * dt;
  while (dist > 0 && e.pi < e.path.length) {
    const p = e.path[e.pi], dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy);

function startDive(e, kind, tx) {
  const p = G.player, side = e.x < W / 2 ? -1 : 1, r = 26;
  const cx = e.x + side * r, cy = e.y, pts = [];

  if (kind === 'beam') {
    const by = H - 250, bx = clamp(p.x, 40, W - 40);
    for (let i = 1; i <= 12; i++) { const k = i / 12, ek = k * k * (3 - 2 * k); pts.push({ x: sx + (bx - sx) * ek, y: sy + (by - sy) * k }); }

    const N = 16, amp = rand(18, 38) * (Math.random() < 0.5 ? -1 : 1), endY = H + 40;

      const k = i / N, ek = k * k * (3 - 2 * k);

    }
  } else if (G.mode === 'gameover') {
    ctx.fillStyle = 'rgba(5,7,20,0.74)'; ctx.fillRect(0, 0, W, H);
    bigText('GAME OVER', 150, 40, '#ff4d6d');
    bigText('Terri has returned to her private island.', 186, 11, '#c9d3ff');
    bigText('Your bench did not pass inspection.', 202, 11, '#c9d3ff');
    bigText('— RESULTS —', 246, 13, '#ffd23f');
    const acc = G.shots ? Math.round(G.hits / G.shots * 1000) / 10 : 0;
    const rows = [['VIRUSES DISPENSED', G.shots], ['TERRIS INFECTED', G.hits], ['PIPETTING ACCURACY', acc + '%'], ['FINAL SCORE', G.score]];
    rows.forEach(([l, v], i) => {
      const y = 278 + i * 25;
      ctx.textBaseline = 'middle'; ctx.font = '800 12px ' + UI; ctx.textAlign = 'left'; ctx.fillStyle = '#aab4dd'; ctx.fillText(l, 46, y);
      ctx.font = '900 13px ' + MONO; ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.fillText(String(v), W - 46, y);
    });
    bigText('RANK:', 392, 11, '#aab4dd');
    bigText(rankFor(G.score), 412, 17, '#7CFF5B');
    if (G.newHi && Math.floor(G.t * 4) % 2 === 0) bigText('NEW HIGH SCORE!', 448, 16, '#ff5bd6');
    if (G.modeT > 1.5 && Math.floor(G.t * 2.2) % 2 === 0) bigText('TAP TO PLAY AGAIN', 510, 18, '#ffffff');
  }
  if (G.paused) {
    ctx.fillStyle = 'rgba(5,7,20,0.65)'; ctx.fillRect(0, 0, W, H);
    bigText('PAUSED', H / 2 - 12, 30, '#ffd23f');
    bigText('Terri is on a coffee break. Tap to resume.', H / 2 + 18, 11, '#c9d3ff');
  }
}
function render() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  drawBG();
  if (G.mode === 'title') { drawTitle(); drawButtons(); return; }
  for (const e of G.enemies) if (e.state === 'beam' && e.beamFrac > 0) drawBeam(e);
  for (const e of G.enemies) drawEnemy(e);
  for (const w of G.pows) drawPow(w);
  for (const b of G.pB) {
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.drawImage(VIR[b.c], -7, -7, 14, 14); ctx.restore();
  }
  for (const b of G.eB) drawEB(b);
  drawPlayer();
  if (G.rescue) { ctx.save(); ctx.translate(G.rescue.x, G.rescue.y); ctx.rotate(G.rescue.rot); drawPipette(0, 0, 0.8, PAL_N, false); ctx.restore(); }
  drawParts(); drawTexts(); drawBubbles();
  drawHUD(); drawOverlay(); drawButtons();
}

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
